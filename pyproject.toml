[project]
name = "volley"
version = "0.1.0"
description = "Gmail-connected agentic AI system for inbound lead response"
requires-python = ">=3.11"
dependencies = [
    # Agent orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    # LLM inference — Groq (free tier)
    "langchain-groq>=1.1.2",
    # Tone RAG — local embeddings (no API key) + vector store
    "sentence-transformers>=5.5.1",
    "chromadb>=0.5.0",
    # Gmail
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
volley = "volley.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["volley"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter, not enforced as an error

[tool.ruff.lint.per-file-ignores]
# Manual phase runners intentionally call load_dotenv() before importing
# modules that read env vars at import time.
"scripts/*" = ["E402"]
